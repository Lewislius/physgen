name: v52-original-single-gpu-training-control
description: 'Original v5.2 entrypoint and existing quick-test mode: 2 planner + 2
  joint updates, full 81 frames, existing caches, one GPU; compare execution with
  native branch.'
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - GPUS=1
  - PLANNER_STEPS=480
  - JOINT_STEPS=420
  - SKIP_PREPARE=1
  - AUTO_PREPARE_CACHE=0
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  - CONFIG=/home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/legacy_v52_controls_20261025/training/config.yaml
  - QUICK_TEST=1
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2/train/train_joint_state_no_lora_1x96g.sh

name: v522-reasoning-operator-single-gpu
description: Single slot. Same v7 model and objectives with exact recomputation of
  contrastive branches to reduce peak memory. Existing unchanged software environment
  and det 0.32.1 submission.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - HF_HUB_DISABLE_PROGRESS_BARS=1
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_reasoning_single/code/tools/run_recorded.py
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_reasoning_single/resources.jsonl
  -- /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_reasoning_single/code/tools/run_reasoning_training.py
  --config /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_reasoning_single/code/configs/native_reasoning_operator_wisa3857.yaml
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_reasoning_single/results
  --train-steps 128

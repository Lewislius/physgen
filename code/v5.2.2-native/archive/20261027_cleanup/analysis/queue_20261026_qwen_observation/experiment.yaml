name: v522-qwen-temporal-observation-existing-pairs
description: Two already saved training pairs; inspect and repair caption-biased Qwen
  process judgments. Compare original and independent chronological observation, both
  video orders. No Wan model and no new generation.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261026_qwen_observation/code/tools/runtime_python.sh
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261026_qwen_observation/code/tools/probe_qwen_video_judge.py
  --pairs /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261026_qwen_process_training/code/checkpoints/v522-native-qwen-process-wisa3857_66260/judge_evidence/train0001_micro1_source0000527.json
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261026_qwen_process_training/code/checkpoints/v522-native-qwen-process-wisa3857_66260/judge_evidence/train0001_micro2_wisa0013657.json
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261026_qwen_observation/results

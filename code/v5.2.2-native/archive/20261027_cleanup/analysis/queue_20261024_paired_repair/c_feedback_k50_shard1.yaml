name: v522-C-full50-recovery-recorded-shard1-20261024
description: Full discrete-adjoint C feedback reproduction after exit 137. Release
  Qwen after legal condition encoding; preserve exact sampling and gradient objective.
  Record child RSS, cgroup OOM events and termination signal.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - HF_HUB_DISABLE_PROGRESS_BARS=1
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/code/tools/run_recorded.py
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/k50_shard1_resources.jsonl
  -- /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/code/tools/check_temporal_feedback_split.py
  --checkpoint /home/liuzhirui/Project/physGen/code/v5.2.2-native/checkpoints/v522-diagnostic-reasoned_process-8cases32updates-seed42_65836/latest.pt
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/c_feedback_k50
  --cases 0 1 2 3 4 --seeds 42 314159 --gradient-steps 50 --shards 2 --shard 1 --discrete-adjoint
  --single-device --condition-controls

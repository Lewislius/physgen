name: v522-paired-verifier-training-feedback-recorded-20261024
description: Use paired calibration supported by three training seeds on eight development
  scenes, reusing completed train-only heads. Four actual model updates, then full
  50-step verifier-to-C feedback and complete control resampling. No future reference
  in verifier scoring or legal C; no full-physics success claim.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - HF_HUB_DISABLE_PROGRESS_BARS=1
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/code/tools/run_recorded.py
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/paired_pipeline_resources.jsonl
  -- /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/code/tools/run_verifier_recovery.py
  --project-root /home/liuzhirui/Project/physGen/code/v5.2.2-native --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/paired_results
  --training-config /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_paired_repair/real_training_check.yaml
  --calibration-directory /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261024_verifier_recovery/results/calibration
  --method paired

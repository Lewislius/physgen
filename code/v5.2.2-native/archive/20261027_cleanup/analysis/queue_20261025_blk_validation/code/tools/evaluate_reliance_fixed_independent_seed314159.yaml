name: v522-reliance-evaluation-independent-seed314159-fixed-noise
description: 'Trained C: same-noise off, swap, slot-collapse and reasoning interventions;
  separate late horizons.'
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - AUTO_RESUME=1
  - CONFIG=/home/liuzhirui/Project/physGen/code/v5.2.2-native/configs/native_physical_wisa3857.yaml
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/tools/evaluate_condition_reliance.py
  --checkpoint /home/liuzhirui/Project/physGen/code/v5.2.2-native/checkpoints/v522-reliance-independent-8cases128updates-seed314159_65863/latest.pt
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/reliance_fixed_independent_seed314159
  --noise-directory /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/shared_eval_noise

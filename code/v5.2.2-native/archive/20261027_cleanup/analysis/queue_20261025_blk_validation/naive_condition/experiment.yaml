name: v522-v8-naive-text-condition-matched-training
description: Same data/order/losses/reader as v8; cached T5 directly maps to C, with
  no Qwen generation-side encoder. First 16 normal updates and matching heldout outputs;
  resumable, not convergence proof.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_blk_validation/code/tools/runtime_python.sh
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_blk_validation/code/tools/run_naive_condition_comparison.py
  --config /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_blk_validation/code/configs/ablation_native_text_causal_response.yaml
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_blk_validation/naive_condition/results

name: v522-reliance-coupled-8cases128updates-seed42
description: 'Paired C-reliance learnability: Wan LoRA stays frozen for all 128 declared
  updates'
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:

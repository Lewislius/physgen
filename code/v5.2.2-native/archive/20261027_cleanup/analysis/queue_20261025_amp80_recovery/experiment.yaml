name: v522-single-gpu-C-feedback-recovery-amp80
description: Single 80GB GPU recovery after unchanged v5.2 inference also SIGKILLed
  on blk H100. Native VAE recomputation, full 81-frame gradients, 3-stage actual updates
  then training. No software changes.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-80g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/code/tools/runtime_python.sh
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/code/tools/run_recorded.py
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/resources.jsonl
  --job-record /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/job.json
  -- /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/code/tools/run_reasoning_training.py
  --config /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/code/configs/native_reasoning_operator_wisa3857.yaml
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/queue_20261025_amp80_recovery/results
  --train-steps 128

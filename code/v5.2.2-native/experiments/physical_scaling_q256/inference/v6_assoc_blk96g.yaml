name: physical-v6-assoc-q256-final1000-demo21-vp40-eval-rtx6000
description: 'Training66678/Run68065 final1000: exact Q256 association model, sequential
  demo21 -> fixed VideoPhy2-40 -> independent SA/PC evaluation -> mean scores and16-reference
  comparison. Seed42, same first frames/T5/FP32 comparison noise; 832x480,81frames,24fps,50
  shifted Euler,shift5,CFG5. Single blk-96g GPU; reject H100 before model loading.
  No generation verifier.'
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/experiments/physical_scaling_q256/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_scaling_q256/inference/run_v6_assoc_blk96g.sh
  --local

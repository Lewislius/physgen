name: physical-v5-ce-q256-s1000-wlr2e5-w128-rtx6000
description: Fresh official bases; V5 full C K/V + C-language CE, Q256, 128 interface
  + 872 joint, seed42. CE warmup64 to0.03 then0.015; Wan peak2e-5 warmup128. One blk-96g
  GPU; actual RTX6000 only, reject H100 before models.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/experiments/physical_v5_scaling_q256/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_v5_scaling_q256/train/train_v5_ce.sh
  --local

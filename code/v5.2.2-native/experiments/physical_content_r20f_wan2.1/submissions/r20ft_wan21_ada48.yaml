workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: ada-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  - HF_HUB_OFFLINE=1
  - TRANSFORMERS_OFFLINE=1
  - HF_DATASETS_OFFLINE=1
  - PYTHONUNBUFFERED=1
  - WAN_CODE=/home/liuzhirui/model/Wan2.1
  - WAN_CKPT=/home/liuzhirui/model/Wan2.1/Wan2.1-T2V-1.3B
  - QWEN_CKPT=/home/liuzhirui/model/Qwen3-VL/Qwen3-VL-8B-Instruct
  - GPU_POLICY=any48
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/experiments/physical_content_r20f_wan2.1/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed
  max_length:
    epochs: 1
  smaller_is_better: false
name: physical-r20ft-wan21-1.3b-fresh400-videophy40-60-controls16
description: 'Official-fresh Wan2.1-T2V-1.3B R20FT: full reasoning, depth-matched
  physical blocks at 0/7/14/21/28, 1536-wide C/video binding and QK-conditioned
  physical execution. Same 1600 samples and fixed 40+20 protocol. Wan2.1 VAE
  latents are rebuilt; no Wan2.2 dimensions, noise or native words are reused.
  Scores and quality are unverified until the run completes.'
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/tools/runtime_python.sh /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_r20f_wan2.1/run_candidate.py --config /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_r20f_wan2.1/configs/r20ft_wan21.yaml

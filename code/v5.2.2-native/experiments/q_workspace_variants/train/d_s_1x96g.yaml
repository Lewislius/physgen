name: v522-q-workspace-d-s-rtx-pro6000-blk96g
description: 'D-S: learned E; persistent identity Cross + original Self + FFN. All
  variants: 128 slots, 4096 workspace, 4096->3072 final projection; R0 + two refinements;
  seed 42; FM + 0.1 temporal FM; 64 interface + 160 joint; accumulation 4. No verifier
  or new losses. Identity is parameter-free RMS-normalized and added after LayerNorm
  in R1/R2. Original generator initialization; separate experiment code and outputs.'
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/experiments/q_workspace_variants/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/q_workspace_variants/train/train_d_s.sh
  --local

name: physical-v7-r4-complete40-remaining24-gamma5
description: User-requested complete40 main comparison. Generate the disjoint24 remaining
  cases using the exact R4-64 checkpoint and frozen inference source. Original16 plus
  controls continue unchanged. No training/download.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/tools/runtime_python.sh
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/grounded_read_r4/snapshots/20261031T064033Z/infer_pipeline.py
  --checkpoint /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/grounded_read_r4/runs/physical_content_66871/step0064.pt
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/grounded_read_r4/inference_outputs/physical_content_66871/step0064_remaining24_physical5_seed42
  --suite videophy40 --physical-guidance 5 --modes real --cases VP001 VP003 VP006
  VP007 VP008 VP011 VP012 VP014 VP019 VP020 VP021 VP022 VP023 VP028 VP029 VP030 VP031
  VP032 VP033 VP035 VP036 VP037 VP039 VP040

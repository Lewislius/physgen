name: physical-r16b-own128-three-failure-cases
description: Only VP002/004/009 visual check using the actual new R16B128 checkpoint;
  no training, no final metric claims, original protocol. Submit after checkpoint
  exists and only on an idle allowed evaluation GPU.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
  - HF_HUB_OFFLINE=1
  - TRANSFORMERS_OFFLINE=1
  - HF_DATASETS_OFFLINE=1
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/tools/runtime_python.sh
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/native_budget_joint_read_r16b/early_quality/run.py
  --config /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/native_budget_joint_read_r16b/snapshots/20261109T090205Z/configs/physical_content.yaml
  --checkpoint /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/native_budget_joint_read_r16b/runs/physical_content_68514/step0128.pt
  --output /home/liuzhirui/Project/physGen/code/v5.2.2-native/experiments/physical_content_v7/native_budget_joint_read_r16b/early_quality/outputs/physical_content_68514
  --pool amp-48g

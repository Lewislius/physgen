name: physical-assoc1000-c-input-causal-audit-20261030
description: Frozen checkpoint audit requested by user; two fixed cases, C swap versus image-only C versus no C. Native T5, first image, LoRA and saved noise unchanged. No training.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/analysis/physical_scaling_audit_20261030/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v5.2.2-native/analysis/physical_scaling_audit_20261030/run_gpu.sh

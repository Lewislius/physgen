name: v522-h-videophy40-no-verifier-independent-autoeval
description: Score the 40 existing H v29 final224 round2 videos from inference 66471
  with the archived VideoPhy2 AutoEval protocol, 32 observed frames, seed 20261009,
  deterministic decoding and max_length 256. No video generation or training.
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - OMP_NUM_THREADS=4
  - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v5.2.2-native/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length:
    epochs: 1
  smaller_is_better: false
entrypoint: /home/liuzhirui/miniconda3/envs/physvid/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v5.2.2-native/tools/evaluate_videophy2.py
  /home/liuzhirui/Project/physGen/code/v5.2.2-native/inference_outputs/v522-h-content-message-no-verifier-simple_66438/videophy40_final224_round2_shared_noise

name: physgen-v4-wisa-native-p-infer-1x80g
description: Final A1 checkpoint; 50 steps; reference I2V plus P01-P20 paired I2V/T2V, 41 videos
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-80g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    # Fixed interpreter: /home/liuzhirui/miniconda3/envs/moviestory/bin/python.
    # Every hardware profile uses this same trained checkpoint and sampling setup.
    - CHECKPOINT=/home/liuzhirui/Project/physGen/code/v4/checkpoints/wisa_native_p_A1_4x96g_20260912T151800Z-e189c27c/checkpoint-final
    - SUITE=both
    - MODE=i2v
    - DEMO_MODES=both
    - WIDTH=512
    - HEIGHT=288
    - DEMO_ROOT=/home/liuzhirui/Project/physGen/code/v1/demo
    - SAMPLE_IDS=all
    # Replace this example image and prompt with the intended generation condition.
    - IMAGE=/home/liuzhirui/model/Wan2.2/overfit_ref/overfit_ref5.jpg
    - PROMPT=The woman smiles and waves at the camera.
    - VARIANT=full
    - SOLVER=euler
    - SAMPLING_STEPS=50
    - SHIFT=5
    - GUIDANCE=5
    - FRAMES=101
    - FPS=24
    - SEED=42
    # CUDA index within the ONE allocated GPU, not the host's physical GPU id.
    - DEVICE=0
    - CHECK_ONLY=0
    # auto follows training: this final checkpoint resets P every denoising step.
    - RESET_STATE=auto
    - OMP_NUM_THREADS=4
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4/inference/infer_wisa_native_p_1x80g.sh

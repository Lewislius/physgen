name: physgen-v42-existing-latent-vae-precision-check
description: Decode one existing stable latent twice to isolate FP32 VAE numerical precision; no diffusion sampling or training
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - OMP_NUM_THREADS=4
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed
  max_length: {epochs: 1}
  smaller_is_better: false
entrypoint: /home/liuzhirui/miniconda3/envs/moviestory/bin/python -I -B -u /home/liuzhirui/Project/physGen/code/v4.2/analysis/verify_vae_precision_step0300.py

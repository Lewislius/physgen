model_version: physgen_v42_f121_independent_correctors_v3
paths:
  wan_code: /home/liuzhirui/model/Wan2.2
  wan_checkpoint: /home/liuzhirui/model/Wan2.2/Wan2.2-TI2V-5B
  teacher_code: /home/liuzhirui/model/vjepa2
  teacher_checkpoint: /home/liuzhirui/model/vjepa2/checkpoint/vjepa2_1_vitG_384.pt
  wisa_index: /run/determined/NAS1/public/Dataset/WISA/data/wisa-80k.json
  wisa_videos: /run/determined/NAS1/public/Dataset/WISA/data/videos
  annotations: ${V42_ROOT}/data_index2400
  cache: ${V42_ROOT}/cache/wisa2400_nativefps_f121_a147456_fp32_jepa32
  asset_lock: ${V42_ROOT}/assets/wan_jepa_metadata.json
  checkpoints: ${V42_ROOT}/checkpoints
  logs: ${V42_ROOT}/train/train_log
  outputs: ${V42_ROOT}/inference_outputs
  demo_root: /home/liuzhirui/Project/physGen/code/v1/demo
  reference_image: /home/liuzhirui/model/Wan2.2/overfit_ref/overfit_ref5.jpg
  reference_prompt: The woman smiles and waves at the camera.
preparation:
  asset_verification: metadata
  reuse_sources:
    - ${V42_ROOT}/cache/wisa4000_nativefps_f121_a147456_fp32_jepa32
    - ${V42_ROOT}/quick16/work/cache_v4_f121
data:
  # Same WISA selection, split, window and image geometry as v4; video limit is now 121.
  seed: 20260909
  limit: 2400
  # Preserve the original 4000-candidate split; retain its first 2400 valid records.
  source_limit: 4000
  subset_manifest: ${V42_ROOT}/cache/wisa4000_nativefps_f121_a147456_fp32_jepa32/manifest.json
  selection_file: null
  clip_annotations: null
  validation_stride: 20
  frames: 121
  max_long_side: 512
  max_area: 147456
  decode_chunk_frames: 8
  # These are v4.2's teacher/state definitions, independent of source-video selection.
  teacher_frames: 32
  teacher_size: 384
  categories: [unlabeled]
state:
  sites: [5, 15]
  parameter_sharing: per_block
  width: 1664
  inner: 512
  heads: 8
  depth: 2
  checkpoint: true
  write_gate: true
loss:
  fm: 1.0
  # v4-style coefficient ceiling, linear high-noise taper and 200-step warmup.
  struct: 0.10
  struct_warmup_steps: 200
  struct_noise_width: 0.2
  struct_initialization_gradient: true
  temp: 0.0
train:
  recipe: fm_struct_v4_limits_gated_uniform_v1
  seed: 20260916
  steps: 1200
  world_size: 1
  accumulation: 8
  save_every: 100
  validate_every: 100
  ema_decay: 0.995
  grad_clip: 1.0
  # Eight ordinary FM+STRUCT samples; one queue, independent equiprobable modes.
  sampling: uniform_modes_v1
  # Preserve FM; remove only opposing STRUCT components, separately per parameter group.
  # 'none' is the explicit control for this optimization rule, not a different loss.
  auxiliary_gradient_policy: project_conflicts
  peak_lr: {core5: 0.00005, core15: 0.00005, text_init: 0.00002, writer5: 0.00001, writer15: 0.00002}
inference:
  canvas_wh: [512, 288]
  steps: 50
  shift: 5.0
  guidance: 5.0
  seed: 42
  duration: 5.0

name: 4h-physgen-v42-step0100-ema-demo41-infer
description: Single Ada 48GB; step0100 EMA; reference I2V plus P01-P20 paired I2V/T2V, 41 videos; UniPC50/shift5/CFG5/seed42
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: ada-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - CHECKPOINT=/home/liuzhirui/Project/physGen/code/v4.2/checkpoints/stability_20260917T113347Z_5d0494/step0100
    - SUITE=demo
    - EVALUATE=0
    - OMP_NUM_THREADS=4
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # Same model/settings as 96GB; encoders, teacher and sampling run sequentially.
    # Uses cuda:0 inside the one allocated slot, preserving the scheduler's GPU mask.
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length: {epochs: 1}
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4.2/inference/infer_stability_1xada48g.sh

name: 12h-physgen-v42-stability-1x96g
description: Formal V4.2 with two correctors at 5/15; V4-style joint FM + STRUCT + PRIOR, additional delta-H WRITE, 75 percent GT initialization; no conflict projection
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    # Formal recipe: FM=1, STRUCT=0.1, PRIOR=0.02, additional WRITE=0.05.
    # V4 loss warmup/noise weighting; one joint backward, no gradient projection.
    # Two independent correctors; GT is a training-only initializer condition.
    - CONFIG=/home/liuzhirui/Project/physGen/code/v4.2/configs/stability_v4_joint.yaml
    - PREPARE=0
    - OMP_NUM_THREADS=4
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length: {epochs: 1}
  smaller_is_better: true
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4.2/train/train_stability_1x96g.sh

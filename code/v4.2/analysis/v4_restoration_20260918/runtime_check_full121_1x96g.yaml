name: physgen-v42-native3-write-full121-runtime-check
description: One full-121-frame optimizer update to check full geometry memory and
  nonzero WRITE gradients; not a training ablation
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
- host_path: /mount/HOME/liuzhirui
  container_path: /home/liuzhirui
- host_path: /mount/NAS1/public
  container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
  - PREPARE=0
  - OMP_NUM_THREADS=4
  - CHECK_STEPS=1
  - CONFIG=/home/liuzhirui/Project/physGen/code/v4.2/analysis/v4_restoration_20260918/runtime_check_full121_config.yaml
  - RUN_NAME=v42_native3_write_full121_runtime_check
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4.2/train/train_stability_1x96g.sh

name: physgen-v42-fullwidth3-write-i2v-infer-1xada48g
description: Native V4 three-corrector checkpoint; P01-P20 I2V, 121 frames JEPA32, Euler50 shift5 CFG5 seed42
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: ada-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - CHECKPOINT=latest
    - SUITE=demo
    - DEMO_MODES=i2v
    - VARIANT=full
    - OMP_NUM_THREADS=4
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    # Same model/settings as 96GB; T5, Wan, and VAE run sequentially; no online JEPA.
    # Uses cuda:0 inside the one allocated slot, preserving the scheduler's GPU mask.
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length: {epochs: 1}
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4.2/inference/infer_stability_1xada48g.sh

name: physgen-v42-v4-fullwidth3-with-prior-1x96g
description: V4 native architecture with three independent 1664-wide correctors at 5/15/25; joint FM1 STRUCT0.1 PRIOR0.02 WRITE1.0; 121 frames, JEPA32, I2V only, 800 steps, checkpoint every 100 steps
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: blk-96g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    # Three full-width V4 correctors; four joint losses, native-H WRITE without RMS bounds.
    - CONFIG=/home/liuzhirui/Project/physGen/code/v4.2/configs/stability_v4_fullwidth3.yaml
    - PREPARE=0
    - OMP_NUM_THREADS=4
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4.2/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: validation_loss
  max_length: {epochs: 1}
  smaller_is_better: true
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4.2/train/train_stability_1x96g.sh

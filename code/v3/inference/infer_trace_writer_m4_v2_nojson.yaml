name: 4h-physgen-m4-t2v-nojson
description: T2V with low-strength stage-only guidance using CFG-separated physics correction
workspace: ALL-IN-ONE
project: wan-animate

max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 1
  is_single_node: true
  shm_size: 34359738368

bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public

environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - PYTHONDONTWRITEBYTECODE=1
    - PYTHONUNBUFFERED=1
    - TOKENIZERS_PARALLELISM=false
    - WAN_REPO=/home/liuzhirui/model/Wan2.2
    - CHECKPOINT_DIR=/home/liuzhirui/model/Wan2.2/Wan2.2-TI2V-5B
    - DEMO_ROOT=/home/liuzhirui/Project/physGen/code/v1/demo
    - PLAN_ROOT=/home/liuzhirui/Project/physGen/code/v1/demo
    - OUTPUT_ROOT=/home/liuzhirui/Project/physGen/code/v3/outputs/trace_writer
    - SAMPLE_IDS=all
    - SEEDS=42
    - FRAME_NUM=97
    - SAMPLING_STEPS=50
    - SAMPLE_SOLVER=unipc
    - GUIDE_SCALE=5.0
    - CFG_MODE=separate
    - PHYS_GUIDANCE_SCALE=2.0
    - SHIFT=5.0
    - FPS=24
    - CONDITIONING_VARIANT=strong_stage
    - STAGE_STRENGTH=0.0
    - STAGE_RATIO_TO_GLOBAL=0.05
    - JSON_GLOBAL_RATIO_TO_GLOBAL=0.0
    - JSON_STAGE_RATIO_TO_GLOBAL=0.0
    - CONDITION_EXTRA_CAP_RATIO=0.10
    - CONDITION_NORM_MAX_SCALE=10.0
    - STAGE_BLOCK_START=14
    - STAGE_BLOCK_STOP=24
    - CONDITIONING_AUDIT=1
    - INFERENCE_DEVICE=0
    - OFFLOAD_MODEL=1
    - T5_CPU=1
    - CONVERT_MODEL_DTYPE=1
    - CONTINUE_ON_ERROR=1
    - SHOW_PROGRESS=1
    - WAN_FLASH_ATTN_FORCE_VERSION=2
    - WAN_FLASH_ATTN_FORCE_CONTIGUOUS=1

checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: /mount/HOME/liuzhirui/Project/physGen/code/v3/determined_checkpoints
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0

searcher:
  name: single
  metric: validation_loss
  max_length:
    epochs: 1
  smaller_is_better: true

profiling:
  enabled: true

entrypoint: /home/liuzhirui/Project/physGen/code/v3/inference/infer_trace_writer_m4_v2_nojson.sh

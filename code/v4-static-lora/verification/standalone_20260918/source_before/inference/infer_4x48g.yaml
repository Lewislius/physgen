name: wan22-static-lora-ema-infer-4x48g
description: Four-GPU model-parallel LoRA EMA inference; same final cases and UniPC50/shift5/CFG5/seed42
workspace: ALL-IN-ONE
project: wan-animate
max_restarts: 0
resources:
  resource_pool: amp-48g
  slots_per_trial: 4
  is_single_node: true
  shm_size: 34359738368
bind_mounts:
  - host_path: /mount/HOME/liuzhirui
    container_path: /home/liuzhirui
  - host_path: /mount/NAS1/public
    container_path: /run/determined/NAS1/public
environment:
  image: 10.130.130.5:8192/lab-dev:latest
  environment_variables:
    - SUITE=final
    - OMP_NUM_THREADS=4
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
checkpoint_storage:
  type: shared_fs
  host_path: /mount/HOME/liuzhirui
  storage_path: Project/physGen/code/v4-static-lora/determined_checkpoints/four_gpu
  save_experiment_best: 0
  save_trial_best: 0
  save_trial_latest: 0
searcher:
  name: single
  metric: completed_cases
  max_length: {epochs: 1}
  smaller_is_better: false
entrypoint: bash /home/liuzhirui/Project/physGen/code/v4-static-lora/inference/infer_4x48g.sh
